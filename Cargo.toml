[package]
name = "turnsignal"
version = "0.1.1"
edition = "2024"
description = "A lightweight inter-agent routing and state-transition layer"
license = "MIT"
repository = "https://github.com/elci-group/turnsignal"
keywords = ["agents", "orchestration", "routing", "state-machine"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[profile.release]
lto = "thin"
strip = true
